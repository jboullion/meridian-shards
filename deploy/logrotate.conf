# Keeps blakserv's logs from growing for ever on the VM. blakserv appends to channel/*.txt
# (admin, debug, error, god, log) on the `channel` volume and never trims them; admin.txt takes
# the output of every maintenance command (the account service's, the Shards Console's polls).
#
# A log is rotated weekly, or sooner once it passes 20 MB (logrotate runs daily), and four old
# copies are kept, compressed. copytruncate empties the live file in place: blakserv opened it
# for appending, so its next line goes at the start of the emptied file. The old copies are
# error.txt.1, error.txt.2.gz and so on, which the *.txt pattern doesn't take again.
#
# Install once on the VM, and again after changing this file (logrotate wants its configs owned
# by root, so it can't be a link into the checkout); deploy/README.md, "Running it":
#   sudo install -o root -g root -m 644 deploy/logrotate.conf /etc/logrotate.d/meridian-shards
# What it would do now:  sudo logrotate -d /etc/logrotate.d/meridian-shards
# Rotate now:            sudo logrotate -f /etc/logrotate.d/meridian-shards

/var/lib/docker/volumes/meridian-shards_channel/_data/*.txt {
    weekly
    maxsize 20M
    rotate 4
    compress
    delaycompress
    copytruncate
    missingok
    notifempty
}
