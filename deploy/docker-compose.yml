# The hosted Meridian Shards stack: blakserv, the WebSocket gateway, and Caddy
# (HTTPS, the client, the game assets, /ws, the download page). Run from the repo root:
#
#   node tools/deploy/stage.ts
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Set SITE_ADDRESS in deploy/.env (see .env.example): the VPS's sslip.io hostname, or
# http://localhost for a local test.

name: meridian-shards

services:
  blakserv:
    build:
      context: .stage
      dockerfile: ../blakserv/Dockerfile
    restart: unless-stopped
    # blakserv's Linux console wants a terminal
    tty: true
    stdin_open: true
    volumes:
      - savegame:/srv/blakserv/savegame
      - channel:/srv/blakserv/channel
    ports:
      # The game port, for original Windows clients built with our SecretKey.
      # Browser and app players come in through the gateway and don't need it.
      - "${GAME_PORT:-5959}:5959"
    stop_grace_period: 60s

  gateway:
    build:
      context: .stage
      dockerfile: ../gateway/Dockerfile
    restart: unless-stopped
    environment:
      GATEWAY_MAX_PER_IP: "${GATEWAY_MAX_PER_IP:-4}"
      GATEWAY_ORIGINS: "${GATEWAY_ORIGINS:-}"
    volumes:
      # The arena's season (arena-state.json) and its settings (arena.json, if put there)
      - arena:/srv/gateway/state
    depends_on:
      - blakserv

  # The account service (docs/adr/0030-account-recovery.md). It shares blakserv's network so it
  # reaches the maintenance port on 127.0.0.1, which stays closed to everything else; Caddy
  # reaches it at blakserv:8060.
  accounts:
    build:
      context: .stage
      dockerfile: ../accounts/Dockerfile
    restart: unless-stopped
    network_mode: "service:blakserv"
    environment:
      ACCOUNTS_SECRET: "${ACCOUNTS_SECRET:-}"
      SITE_URL: "${SITE_URL:-https://m59-shards.com}"
      RESEND_API_KEY: "${RESEND_API_KEY:-}"
      MAIL_FROM: "${MAIL_FROM:-Meridian Shards <noreply@m59-shards.com>}"
      TURNSTILE_SECRET: "${TURNSTILE_SECRET:-}"
    depends_on:
      - blakserv

  web:
    image: caddy:2
    restart: unless-stopped
    environment:
      SITE_ADDRESS: "${SITE_ADDRESS:-http://localhost}"
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp"
    volumes:
      - ./web/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./.stage/client:/srv/client:ro
      - ./.stage/site:/srv/site:ro
      - ./.stage/assets:/srv/assets:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - gateway
      - accounts

volumes:
  savegame:
  channel:
  arena:
  caddy-data:
  caddy-config:
