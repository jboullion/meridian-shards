<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- A simplified no-guard emblem for favicons (concepts/emblem-noguard.png at 16-32 px): five
       roses as bold discs with one swirl each, four leaves, and the shard alone in strong yellow -->
  <title>Meridian Shards</title>
  <defs>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#fedf01" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fedf01" stop-opacity="0"/>
    </radialGradient>
    <g id="r">
      <circle r="11.5" fill="#b0121c" stroke="#4f050b" stroke-width="1.6"/>
      <circle r="6.5" fill="#dc2a33"/>
      <path d="M-1,-1 a2.5,2.5 0 1 1 3,3 a5.5,5.5 0 1 1 -7,-5 a8.5,8.5 0 1 1 11,9" fill="none" stroke="#6e0811" stroke-width="1.5" stroke-linecap="round"/>
    </g>
    <path id="l" d="M0,0 C4,-5 11,-5 15,0 C11,5 4,5 0,0Z" fill="#2e9a3a" stroke="#0f4416" stroke-width="1"/>
  </defs>
  <use href="#l" transform="translate(15 27) rotate(200)"/>
  <use href="#l" transform="translate(49 27) rotate(-20)"/>
  <use href="#l" transform="translate(19 52) rotate(140)"/>
  <use href="#l" transform="translate(45 52) rotate(40)"/>
  <use href="#r" transform="translate(19.5 18)"/>
  <use href="#r" transform="translate(44.5 18)"/>
  <use href="#r" transform="translate(13 36)"/>
  <use href="#r" transform="translate(51 36)"/>
  <use href="#r" transform="translate(32 50)"/>
  <!-- the shard on its own, its lower point resting on the bottom rose, with a soft glow -->
  <ellipse cx="32" cy="24" rx="11" ry="22" fill="url(#glow)"/>
  <polygon points="32,2 39,16 37,37 32,48 27,37 25,16" fill="#fedf01" stroke="#5a3d00" stroke-width="1.2" stroke-linejoin="round"/>
  <polygon points="32,2 39,16 37,37 32,48" fill="#e8b10c"/>
  <polygon points="32,2 25,16 28,16 32,5" fill="#fff6a8"/>
  <path d="M28.5,18 L29.5,35" stroke="#fffbe0" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
</svg>
