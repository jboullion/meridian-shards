# Meridian Shards local server config: the original (101) server.
# Source of truth for server\src-101\run\server\blakserv.cfg (copied by server\setup-run.cmd).
# Only settings that differ from the blakserv defaults (blakserv/config.c) are listed.
# The original server's paths: rooms and Kod stay in the source tree (its own run\server\blakserv.cfg).

[Path]
Bof                  loadkod\
Memmap               memmap\
Rsc                  rsc\
Rooms                ..\..\resource\rooms\
Motd                 .\
Channel              channel\
LoadSave             savegame\
Forms                .\
Kodbase              ..\..\kod
PackageFile          .\

[Socket]
Port                 5959
MaintenancePort      9998
# The original server is IPv4 only
MaintenanceMask      127.0.0.1
Nagle                No

[Channel]
DebugDisk            Yes
ErrorDisk            Yes
LogDisk              Yes
Flush                Yes

[Console]
Caption              Meridian Shards (local 101)

[Constants]
Enabled              Yes
Filename             ..\..\kod\include\blakston.khd

# [Update]: patching and downloads stay off: every patch host and path defaults to empty.
# There's no account auto-create: make accounts on the maintenance port (AGENTS.md).

[Auto]
SavePeriod           30
