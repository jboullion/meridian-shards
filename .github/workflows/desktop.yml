# Builds the desktop installers on Windows, macOS and Linux and the Android APK, uploads them
# with the update feeds to a draft GitHub release for v<version> (apps/desktop/package.json), and
# publishes that release once every platform is there. Installed apps and the download page use the
# latest published release.
#
# Start it with `npm run release -- <x.y.z>` (tools/deploy/release.ts: bumps the version,
# tags, pushes and follows this run), or push a v<version> tag yourself. Running it from the
# Actions tab builds the current version without publishing.
#
# The installers carry the game files. Raw art is never in git, so each build copies them
# from the hosted server's /assets/ (tools/assets/fetch-assets.ts), cached between runs by
# the server's manifest. Deploy the server first, so its files are the ones being shipped.

name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  ASSETS_FROM: https://35-206-75-121.sslip.io

jobs:
  # One draft for the three builds to upload into (each making its own can race into duplicates)
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "Meridian Shards $GITHUB_REF_NAME" --generate-notes
      # Drafts are never public; one left over is a run that failed before publishing
      - name: Delete drafts of earlier versions
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft --jq '.[] | select(.isDraft) | .tagName' | while read -r tag; do
            if [ "$tag" != "$GITHUB_REF_NAME" ]; then
              echo "deleting the draft for $tag"
              gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes
            fi
          done

  build:
    needs: draft
    # From the Actions tab there's no tag and no draft (skipped): build only
    if: ${{ !failure() && !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: The server's manifest (the cache key for its files)
        run: curl -fsSL "$ASSETS_FROM/assets/manifest.json" -o server-manifest.json
        shell: bash
      - uses: actions/cache@v4
        with:
          path: dist/assets
          key: game-files-${{ hashFiles('server-manifest.json') }}
          restore-keys: game-files-
      - name: Game files from the server
        run: node tools/assets/fetch-assets.ts --from "$ASSETS_FROM"
        shell: bash
      # On a failure the log's last lines become an error annotation: unlike the log,
      # annotations can be read without signing in, so tools/deploy/release.ts prints them
      - name: Build and upload to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -o pipefail
          if ! npm run desktop:release 2>&1 | tee build.log; then
            echo "::error title=Build failed::$(tail -n 40 build.log | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
            exit 1
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Unsigned for now (docs/adr/0002-desktop-shell.md); stops macOS looking for a certificate
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - name: Build only (not a tag)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        shell: bash
        run: |
          set -o pipefail
          if ! npm run desktop:dist 2>&1 | tee build.log; then
            echo "::error title=Build failed::$(tail -n 40 build.log | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
            exit 1
          fi
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"

  # The Android APK (apps/android, docs/adr/0003-android.md) into the same draft: the client in
  # Capacitor with the same game files, signed with the release key. Every update must carry the
  # same signature, so the key lives in the repository's secrets:
  #   ANDROID_KEYSTORE_BASE64    the .jks, base64 (~/.meridian-shards/android-release.jks)
  #   ANDROID_KEYSTORE_PASSWORD  its password (storePassword in android-release.properties)
  android:
    needs: draft
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          version=$(node -p "require('./apps/desktop/package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match apps/desktop/package.json version $version"
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # Gradle 8.14 (the Capacitor template's) runs on JDK 21
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: The server's manifest (the cache key for its files)
        run: curl -fsSL "$ASSETS_FROM/assets/manifest.json" -o server-manifest.json
        shell: bash
      - uses: actions/cache@v4
        with:
          path: dist/assets
          key: game-files-${{ hashFiles('server-manifest.json') }}
          restore-keys: game-files-
      - name: Game files from the server
        run: node tools/assets/fetch-assets.ts --from "$ASSETS_FROM"
        shell: bash
      - name: The release key
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error title=No Android release key::Add the ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD secrets (docs/adr/0003-android.md)"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/android-release.jks"
          echo "SHARDS_KEYSTORE=$RUNNER_TEMP/android-release.jks" >> "$GITHUB_ENV"
      # Without the key (a run from the Actions tab) the APK comes out unsigned: a build check only
      - name: Build the APK
        shell: bash
        env:
          SHARDS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SHARDS_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SHARDS_KEY_ALIAS: meridian-shards
        run: |
          set -o pipefail
          if ! (npm run android:sync && cd apps/android/android && sh ./gradlew assembleRelease --console=plain) 2>&1 | tee build.log; then
            echo "::error title=Build failed::$(tail -n 40 build.log | tr -d '\r' | sed 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } { print }')"
            exit 1
          fi
      - name: Upload to the draft release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apk="Meridian-Shards-${GITHUB_REF_NAME#v}.apk"
          cp apps/android/android/app/build/outputs/apk/release/app-release.apk "$apk"
          gh release upload "$GITHUB_REF_NAME" "$apk" --repo "$GITHUB_REPOSITORY" --clobber

  # Publishes the draft once all three platforms and the APK built and uploaded. A failed build
  # leaves the draft unpublished, so players never get half a release.
  publish:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Every platform's files are in the draft
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          names=$(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$names"
          for pattern in '\.exe$' '\.exe\.blockmap$' '-mac\.dmg$' '-mac\.zip$' '\.AppImage$' '\.deb$' '^latest\.yml$' '^latest-mac\.yml$' '^latest-linux\.yml$' '\.apk$'; do
            if ! grep -Eq -- "$pattern" <<< "$names"; then
              echo "::error::The release has no file matching $pattern"
              exit 1
            fi
          done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
